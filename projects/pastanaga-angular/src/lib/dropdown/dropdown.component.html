<div
  class="pa-popup"
  [hidden]="!isDisplayed"
  [ngStyle]="style">
  <div
    class="pa-popup-wrapper"
    [class.no-max-width]="sameWidth">
    <ul
      class="pa-menu"
      [attr.role]="role"
      [attr.aria-label]="ariaLabel || null">
      <ng-content></ng-content>
    </ul>
  </div>
</div>
